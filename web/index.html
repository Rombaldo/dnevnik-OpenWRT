<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5468f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Дневник">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<title>Мой дневник</title>
<script>
// Тема и размер применяются до отрисовки, чтобы страница не мигала
try { const s = JSON.parse(localStorage.getItem("settings") || "{}");
  if (s.theme === "light" || s.theme === "dark") document.documentElement.dataset.theme = s.theme;
  if ([0.9, 1.1, 1.2].includes(s.scale)) document.documentElement.style.zoom = s.scale; } catch (e) {}
</script>
<style>
  :root {
    --bg: #f2f4ff; --card: #ffffff; --ink: #1c2236; --muted: #667089; --line: #e6e9f6;
    --brand: #5468f0; --brand-ink: #ffffff; --brand-2: #8a5cf6; --brand-soft: #e9edff; --ok: #1f9d55; --ok-soft: #e0f6e9;
    --shadow: 0 1px 2px rgba(40,50,110,.06), 0 6px 18px rgba(40,50,110,.06);
    --m5: #1fa55b; --m4: #6cc04a; --m3: #f2a516; --m2: #ee6a3c; --m1: #dc3b45; --mx: #8b94ab;
    --banner-warn-bg: #fff3d6; --banner-warn-ink: #6a4700; --banner-bad-bg: #ffe3e3; --banner-bad-ink: #7d1d1d;
    --banner-info-bg: #e4eaff; --banner-info-ink: #263b8c;
    --soft: #f2f4ff; --strip-bg: #dbe6ff; --strip-edge: #ffffff; --strip-check: rgba(255,255,255,.6);
    --warn-bg: #fff0e0; --warn-ink: #b45309;
    --c-ill-bg: #fff0d6; --c-ill: #b45309; --c-abs-bg: #ffe0e0; --c-abs: #b3261e; --c-late-bg: #e7ddff; --c-late: #5a3fc0;
    color-scheme: light;
  }
  /* Тёмная тема: выбрана вручную или включена на устройстве (если не выбрана светлая). Значения ниже записаны дважды. */
  :root[data-theme="dark"] {
    --bg: #10131e; --card: #1a1f31; --ink: #eef1fb; --muted: #9aa3bd; --line: #2a3048;
    --brand: #7c8fff; --brand-ink: #10131e; --brand-2: #a583ff; --brand-soft: #232b55; --ok: #46c27a; --ok-soft: #173525;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    --banner-warn-bg: #3a2f12; --banner-warn-ink: #ffd9a0; --banner-bad-bg: #3b1a1a; --banner-bad-ink: #ffbcbc;
    --banner-info-bg: #1d2850; --banner-info-ink: #c7d4ff;
    --soft: #222842; --strip-bg: #2c3768; --strip-edge: #4a5690; --strip-check: transparent;
    --warn-bg: #3a2a14; --warn-ink: #ffc277;
    --c-ill-bg: #4a3716; --c-ill: #ffc277; --c-abs-bg: #4a1d1d; --c-abs: #ff9b95; --c-late-bg: #2f2656; --c-late: #c7b6ff;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10131e; --card: #1a1f31; --ink: #eef1fb; --muted: #9aa3bd; --line: #2a3048;
      --brand: #7c8fff; --brand-ink: #10131e; --brand-2: #a583ff; --brand-soft: #232b55; --ok: #46c27a; --ok-soft: #173525;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
      --banner-warn-bg: #3a2f12; --banner-warn-ink: #ffd9a0; --banner-bad-bg: #3b1a1a; --banner-bad-ink: #ffbcbc;
      --banner-info-bg: #1d2850; --banner-info-ink: #c7d4ff;
      --soft: #222842; --strip-bg: #2c3768; --strip-edge: #4a5690; --strip-check: transparent;
      --warn-bg: #3a2a14; --warn-ink: #ffc277;
      --c-ill-bg: #4a3716; --c-ill: #ffc277; --c-abs-bg: #4a1d1d; --c-abs: #ff9b95; --c-late-bg: #2f2656; --c-late: #c7b6ff;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Один размер текста на всех экранах; крупнее или мельче делается в «Настройках» (zoom на странице целиком) */
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 18px/1.42 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  body { padding-bottom: calc(90px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; }

  /* ---- шапка ---- */
  header { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; position: relative; overflow: hidden;
    padding: calc(8px + env(safe-area-inset-top)) 16px 10px; }
  header::before, header::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.12); }
  header::before { width: 180px; height: 180px; right: -50px; top: -70px; }
  header::after { width: 110px; height: 110px; right: 90px; bottom: -70px; }
  .head-in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
  .head-in .grow { flex: 1; min-width: 0; }
  .hello { font-size: 20px; font-weight: 800; letter-spacing: -.2px; margin: 0; line-height: 1.2; }
  .meta { display: flex; flex-wrap: wrap; gap: 0 10px; margin-top: 2px; }
  .sub { font-size: 13px; opacity: .88; }
  .who { font-size: 14px; font-weight: 700; overflow-wrap: anywhere; }
  .refresh { background: rgba(255,255,255,.22); border: 0; border-radius: 14px; min-height: 42px; min-width: 42px; padding: 0 12px; font-size: 15px; font-weight: 600; }
  @media (max-width: 480px) { .refresh .rlabel { display: none; } .refresh #ricon { font-size: 22px; } .head-in { gap: 8px; } }
  .refresh:active { background: rgba(255,255,255,.35); }
  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  main { max-width: 1100px; margin: 0 auto; padding: 12px 16px 0; position: relative; z-index: 2; }
  .grid > div > :first-child, .aside > h2:first-child { margin-top: 0; }   /* верх всех экранов начинается на одной высоте */
  .grid { display: block; }
  @media (min-width: 960px) { .grid.two { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; } }
  .aside { display: none; }
  @media (min-width: 960px) { .aside { display: block; } }

  .banner { border-radius: 16px; padding: 12px 16px; margin: 0 0 12px; font-size: 16px; box-shadow: var(--shadow); }
  .banner.warn { background: var(--banner-warn-bg); color: var(--banner-warn-ink); }
  .banner.bad { background: var(--banner-bad-bg); color: var(--banner-bad-ink); }
  .banner.info { background: var(--banner-info-bg); color: var(--banner-info-ink); }

  /* ---- карточка-итог ---- */
  .hero { background: var(--card); border-radius: 22px; padding: 18px 18px 16px; margin: 0 0 8px; box-shadow: var(--shadow); }
  .hero .big { font-size: 22px; font-weight: 800; line-height: 1.25; }
  .hero .small { color: var(--muted); font-size: 15px; margin-top: 4px; }
  .bar { height: 14px; background: var(--brand-soft); border-radius: 99px; margin-top: 14px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--brand), var(--brand-2)); border-radius: 99px; transition: width .35s ease; }
  .hero.all-done .bar > i { background: linear-gradient(90deg, #35c46f, #1f9d55); }
  .hero.all-done { background: var(--ok-soft); }

  h2 { font-size: 19px; margin: 22px 4px 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: 13px; font-weight: 700; padding: 3px 11px; border-radius: 99px; background: var(--brand); color: #fff; }
  .tag.soft { background: var(--brand-soft); color: var(--brand); }

  /* ---- карточка урока ---- */
  .card { background: var(--card); border-radius: 20px; padding: 14px 16px; margin: 0 0 10px; box-shadow: var(--shadow); }
  .hw { display: flex; gap: 14px; align-items: center; border-left: 6px solid var(--c, var(--brand)); transition: opacity .2s; }
  .ic { width: 52px; height: 52px; min-width: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
    font-size: 28px; background: var(--cbg, var(--brand-soft)); }
  .hw .body { flex: 1; min-width: 0; }
  .hw .subj { font-weight: 800; font-size: 19px; }
  .hw .time { display: block; color: var(--muted); font-size: 14px; font-weight: 500; }
  @media (max-width: 480px) {
    .hw { gap: 10px; padding: 12px 12px 12px 10px; }
    .hw .ic { width: 42px; height: 42px; min-width: 42px; font-size: 23px; border-radius: 13px; }
    .check { width: 50px; height: 50px; min-width: 50px; border-radius: 16px; }
    .hw .text { font-size: 18px; }
    .hello { font-size: 23px; }
    .refresh { padding: 0 12px; }
  }
  .hw .text { margin-top: 3px; font-size: 19px; overflow-wrap: anywhere; }
  .hw .files { margin-top: 6px; color: var(--muted); font-size: 14px; }
  .check { width: 56px; height: 56px; min-width: 56px; border-radius: 18px; border: 3px solid var(--line); background: transparent;
    font-size: 30px; line-height: 1; color: transparent; transition: transform .1s, background .15s; }
  .check:active { transform: scale(.92); }
  .hw.done { opacity: .6; }
  .hw.done .check { background: var(--ok); border-color: var(--ok); color: #fff; }
  .hw.done .text { text-decoration: line-through; }
  .none { color: var(--muted); font-size: 15px; margin: 2px 4px 8px; }
  .free { background: var(--card); border-radius: 16px; padding: 12px 16px; margin: 0 0 10px; color: var(--muted); font-size: 16px; box-shadow: var(--shadow); }

  /* ---- оценки ---- */
  .mark { display: inline-flex; align-items: center; justify-content: center; min-width: 46px; height: 46px; padding: 0 8px; border-radius: 14px;
    font-weight: 800; font-size: 24px; color: #fff; background: var(--mx); }
  .m5 { background: var(--m5); } .m4 { background: var(--m4); } .m3 { background: var(--m3); } .m2 { background: var(--m2); } .m1 { background: var(--m1); }
  .mark.sm { min-width: 36px; height: 36px; font-size: 19px; border-radius: 11px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; padding-top: 2px; }
  .row:last-child { padding-bottom: 2px; }
  .row .mark { width: 58px; min-width: 58px; padding: 0; }
  .row .t { flex: 1; min-width: 0; }
  .row .t b { display: block; font-size: 18px; }
  .row .t span { color: var(--muted); font-size: 14px; }
  .row .t span.new, .new { font-size: 11px; font-weight: 800; background: #ff5a7a; color: #fff; padding: 2px 8px; border-radius: 99px; margin-left: 8px; vertical-align: 2px; display: inline; }
  .ver { text-align: center; color: var(--muted); font-size: 12px; margin: 26px 0 4px; opacity: .7; }
  .cards2 { display: grid; grid-template-columns: 1fr; gap: 0 14px; }
  @media (min-width: 700px) { .cards2 { grid-template-columns: 1fr 1fr; } }
  .lesson .t span.theme { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .subjhead { display: flex; align-items: center; gap: 12px; }
  .subjhead .ic { width: 44px; height: 44px; min-width: 44px; font-size: 23px; border-radius: 14px; }
  .subjhead b { flex: 1; font-size: 19px; }
  .avg { color: var(--muted); font-size: 15px; text-align: right; line-height: 1.2; }
  .avg strong { display: block; color: var(--ink); font-size: 22px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

  /* ---- расписание ---- */
  .plan-body { touch-action: pan-y; min-height: 55vh; }
  .plan-body.from-right { animation: fromRight .22s ease-out; } .plan-body.from-left { animation: fromLeft .22s ease-out; }
  @keyframes fromRight { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
  @keyframes fromLeft { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
  .swipehint { text-align: center; color: var(--muted); font-size: 13px; margin: 10px 0 0; }
  .nav { display: flex; align-items: center; gap: 10px; margin: 6px 0 12px; }
  .nav button { background: var(--card); border: 0; border-radius: 16px; min-width: 60px; min-height: 56px; font-size: 26px; box-shadow: var(--shadow); }
  .nav button:disabled { opacity: .35; }
  .nav .ttl { flex: 1; text-align: center; font-weight: 800; font-size: 21px; line-height: 1.2; }
  .nav .ttl small { display: block; font-weight: 500; color: var(--muted); font-size: 15px; }
  .lesson { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .lesson:first-child { border-top: 0; padding-top: 2px; }
  .lesson:last-child { padding-bottom: 2px; }
  .lesson .n { width: 20px; text-align: center; color: var(--muted); font-weight: 800; }
  .lesson .t { flex: 1; min-width: 0; }
  .lesson .t b { font-size: 18px; }
  .lesson .t span { display: block; color: var(--muted); font-size: 14px; }
  .lesson.off { opacity: .5; } .lesson.off b { text-decoration: line-through; }
  .lesson.now { background: var(--brand-soft); border-radius: 16px; padding: 10px 10px; margin: 0 -10px; border-top-color: transparent; }
  .now-tag { font-size: 11px; font-weight: 800; background: var(--brand); color: #fff; padding: 2px 8px; border-radius: 99px; margin-left: 8px; vertical-align: 2px; }
  .lesson .ic { width: 44px; height: 44px; min-width: 44px; font-size: 23px; border-radius: 14px; }


  /* ---- дни во вкладке «Домашка»: тот же фон, карточки и шрифты, что в «Расписании» ---- */
  .day { background: var(--card); border-radius: 20px; padding: 14px 16px 8px; margin: 0 0 14px; box-shadow: var(--shadow); scroll-margin-top: 12px; }
  .dtitle { font-size: 21px; font-weight: 800; line-height: 1.25; }
  .rel { color: var(--brand); }
  .dprog { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--muted); font-size: 16px; }
  .dprog b { color: var(--ink); font-size: 20px; }
  .dpi { width: 32px; height: 32px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); display: inline-flex; align-items: center; justify-content: center; font-size: 17px; }
  .day .bar { margin: 12px 0 12px; height: 12px; }
  .day.all-done .bar > i { background: linear-gradient(90deg, #35c46f, #1f9d55); }
  .cheer { background: var(--ok-soft); color: var(--ok); font-weight: 700; border-radius: 14px; padding: 10px 14px; margin: 0 0 12px; font-size: 16px; }
  .lessons2 { display: block; }
  .lesson2 { background: var(--soft); border-radius: 16px; padding: 6px 10px 10px; margin: 0 0 10px; }
  .lesson2.off { opacity: .55; }
  .lhead { display: flex; align-items: center; gap: 12px; padding: 8px 2px; cursor: pointer; }
  .lic { width: 44px; height: 44px; min-width: 44px; border-radius: 14px; background: var(--cbg, var(--brand-soft)); display: flex; align-items: center; justify-content: center; font-size: 23px; }
  .lt { flex: 1; min-width: 0; } .lt b { display: block; font-size: 18px; line-height: 1.25; } .lt span { color: var(--muted); font-size: 14px; }
  .chev { color: var(--brand); font-size: 28px; line-height: 1; transition: transform .15s; padding: 0 4px; }
  .lesson2.open .chev { transform: rotate(90deg); }
  .ldetails { display: none; color: var(--muted); font-size: 15px; padding: 2px 4px 8px; }
  .lesson2.open .ldetails { display: block; }
  .strip { display: flex; align-items: center; gap: 12px; background: var(--strip-bg); border-radius: 14px; padding: 10px 10px 10px 14px; }
  .strip .stext { flex: 1; min-width: 0; }
  .strip .text { font-size: 18px; margin: 0; overflow-wrap: anywhere; line-height: 1.35; }
  .strip .check { width: 46px; height: 46px; min-width: 46px; border-radius: 50%; border: 3px solid var(--strip-edge); background: var(--strip-check); font-size: 26px; }
  .strip.done .check { background: var(--ok); border-color: var(--ok); color: #fff; }
  .strip.done .text { text-decoration: line-through; opacity: .6; }
  .file { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 14px; padding: 10px 12px; margin-top: 8px; color: var(--ink); text-decoration: none; flex-wrap: wrap; }
  .strip .text + .file { margin-top: 10px; }
  .file .fic { font-size: 26px; line-height: 1; }
  .file .fn { flex: 1; min-width: 140px; font-weight: 700; font-size: 16px; overflow-wrap: anywhere; line-height: 1.25; }
  .file .fs { color: var(--brand); font-size: 14px; font-weight: 600; }
  .file.off .fs { color: var(--muted); font-weight: 500; }
  a.file:active { filter: brightness(.95); }
  .pastbtn { display: block; width: 100%; margin: 0 0 14px; padding: 14px; border: 0; border-radius: 16px; background: var(--card); color: var(--brand); font-weight: 700; font-size: 16px; box-shadow: var(--shadow); }

  /* ---- вход в Дневник.ру ---- */
  .setup { padding: 20px 18px; }
  .setup h2 { margin: 0 0 6px; font-size: 22px; }
  .setup p { margin: 6px 0 14px; color: var(--muted); font-size: 16px; }
  .setup label { display: block; font-weight: 700; font-size: 16px; margin: 12px 0 6px; }
  .setup input { width: 100%; min-height: 54px; padding: 10px 14px; font-size: 20px; border-radius: 14px; border: 2px solid var(--line);
    background: var(--bg); color: var(--ink); }
  .setup input:focus { outline: none; border-color: var(--brand); }
  .setup button.go { width: 100%; min-height: 58px; margin-top: 18px; border: 0; border-radius: 16px; background: var(--brand); color: var(--brand-ink);
    font-size: 20px; font-weight: 800; }
  .setup button.go:disabled { opacity: .6; }
  .setup .msg { margin-top: 14px; padding: 12px 14px; border-radius: 14px; font-size: 16px; }
  .setup .msg.bad { background: var(--banner-bad-bg); color: var(--banner-bad-ink); }
  .setup .msg.good { background: var(--ok-soft); color: var(--ok); font-weight: 700; }
  .setup details { margin-top: 16px; color: var(--muted); font-size: 15px; }
  .setup summary { cursor: pointer; font-weight: 700; color: var(--brand); }
  .setup .fine { margin: 14px 0 0; font-size: 13px; }
  .banner button { margin-top: 8px; padding: 10px 16px; border: 0; border-radius: 12px; background: var(--brand); color: var(--brand-ink); font-weight: 700; font-size: 16px; }
  .linkbtn { display: block; margin: 18px auto 0; background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; }

  /* ---- оценки: переключатель «Сейчас / Итоги», годы, триместры ---- */
  .seg { display: flex; gap: 6px; padding: 5px; background: var(--card); border-radius: 18px; box-shadow: var(--shadow); margin: 0 0 12px; }
  .seg button { flex: 1; min-height: 48px; border: 0; border-radius: 14px; background: transparent; color: var(--muted); font-size: 17px; font-weight: 700; }
  .seg button.on { background: var(--brand); color: var(--brand-ink); }
  .seg.small button { min-height: 44px; font-size: 16px; }
  .yearnav .ttl small { display: block; }
  .term-sub { margin: 0 0 8px 4px; color: var(--muted); font-size: 15px; }
  .fin { display: grid; grid-template-columns: minmax(100px, 2fr) repeat(var(--cols), minmax(36px, 1fr)); gap: 6px 3px; align-items: center; background: var(--card);
    border-radius: 20px; padding: 12px 12px; box-shadow: var(--shadow); }
  .fin .h { color: var(--muted); font-size: 13px; font-weight: 700; text-align: center; padding-bottom: 4px; }
  .fin .h:first-child { text-align: left; }
  .fin .sn { font-weight: 700; font-size: 15px; line-height: 1.2; overflow-wrap: break-word; }
  .fin .c { text-align: center; }
  .fin .c .mark { min-width: 34px; height: 34px; padding: 0 4px; font-size: 18px; }
  @media (max-width: 480px) { .who { font-size: 14px; } .fin { padding: 10px 8px; } }
  .fin .dash { color: var(--muted); }
  .fin .avgc { text-align: center; font-weight: 700; font-size: 15px; }
  .rowline { grid-column: 1 / -1; height: 1px; background: var(--line); margin: 2px 0; }

  /* ---- окно подтверждения (смена входа) ---- */
  .modal-back { position: fixed; inset: 0; z-index: 60; background: rgba(15,20,40,.62); display: flex; align-items: center; justify-content: center; padding: 18px; }
  .modal { background: var(--card); color: var(--ink); border-radius: 24px; padding: 22px 20px 18px; max-width: 440px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .modal h3 { margin: 0 0 8px; font-size: 21px; line-height: 1.25; }
  .modal p { margin: 0 0 18px; color: var(--muted); font-size: 17px; }
  .mbtns { display: grid; gap: 10px; }
  .mbtns button { min-height: 56px; border: 0; border-radius: 16px; font-size: 18px; font-weight: 800; }
  .mbtns .safe { background: var(--brand); color: var(--brand-ink); }
  .mbtns .danger { background: var(--banner-bad-bg); color: var(--banner-bad-ink); }
  .mbtns .danger:disabled { opacity: .55; }

  /* ---- выход и возврат входа ---- */
  .setup button.restore { width: 100%; min-height: 54px; margin: 6px 0 4px; border: 2px solid var(--brand); border-radius: 16px; background: transparent; color: var(--brand); font-size: 18px; font-weight: 800; }
  .empty { text-align: center; color: var(--muted); padding: 50px 10px; background: var(--card); border-radius: 22px; box-shadow: var(--shadow); }
  .empty .em { font-size: 54px; display: block; margin-bottom: 6px; }

  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); box-shadow: 0 -4px 20px rgba(40,50,110,.1);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); z-index: 10; display: flex; gap: 6px; justify-content: center; }
  nav.tabs button { flex: 1; max-width: 260px; border: 0; background: transparent; color: var(--muted); border-radius: 18px;
    padding: 8px 4px; min-height: 66px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 14px; font-weight: 600; }
  nav.tabs button .e { font-size: 26px; line-height: 1; }
  nav.tabs button.on { color: var(--brand); background: var(--brand-soft); }

  /* ---- кнопка-шестерёнка и экран «Настройки» ---- */
  .gear { background: rgba(255,255,255,.22); border: 0; border-radius: 14px; min-height: 42px; min-width: 42px; font-size: 22px; line-height: 1; padding: 0; }

  .settings .back { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 0; border-radius: 14px; min-height: 48px; padding: 0 16px; font-size: 17px; font-weight: 700; color: var(--brand); box-shadow: var(--shadow); }
  .settings h1 { font-size: 24px; margin: 14px 4px 4px; }
  .set-card { background: var(--card); border-radius: 20px; padding: 14px 16px; margin: 12px 0 0; box-shadow: var(--shadow); }
  .set-card h2 { margin: 0 0 4px; font-size: 18px; }
  .set-card .hint { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
  .set-card .seg { box-shadow: none; background: var(--soft); margin: 6px 0 0; }
  .set-card .seg button { font-size: 16px; padding: 0 4px; }
  .setrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .setrow:first-of-type { border-top: 0; }
  .setrow .lbl { flex: 1; min-width: 0; font-size: 17px; font-weight: 600; }

  .sw { position: relative; width: 62px; min-width: 62px; height: 36px; border-radius: 99px; border: 0; background: var(--line); transition: background .15s; }
  .sw::after { content: ""; position: absolute; top: 4px; left: 4px; width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
  .sw[aria-checked="true"] { background: var(--brand); }
  .sw[aria-checked="true"]::after { transform: translateX(26px); }
  .setbtn { display: block; width: 100%; min-height: 52px; margin-top: 10px; border: 2px solid var(--line); border-radius: 14px; background: transparent; font-size: 17px; font-weight: 700; color: var(--ink); }
  .setbtn.danger { border-color: var(--banner-bad-ink); color: var(--banner-bad-ink); }
  .setbtn.asked { background: var(--banner-bad-bg); }
  .set-card input.pw { display: block; width: 100%; min-height: 50px; margin-top: 8px; padding: 8px 14px; font-size: 18px; border-radius: 14px;
    border: 2px solid var(--line); background: var(--bg); color: var(--ink); }
  .set-card input.pw:focus { outline: none; border-color: var(--brand); }

  .set-card .msg.good { background: var(--ok-soft); color: var(--ok); font-weight: 700; }
  .setbtn.main { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  body.locked nav.tabs, body.locked #gear, body.locked #refresh { display: none !important; }
  /* ---- карточка оценки ---- */
  .tap { cursor: pointer; -webkit-tap-highlight-color: transparent; }

  .mark.tap:active { transform: scale(.94); }
  .tap:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 12px; }
  .markmodal { max-width: 460px; padding: 20px 20px 18px; max-height: 92vh; overflow: auto; }
  .mm-head { display: flex; align-items: flex-start; gap: 12px; }
  .mm-head h3 { margin: 0; font-size: 24px; }
  .mm-sub { color: var(--muted); font-size: 16px; margin-top: 2px; }
  .mm-x { margin-left: auto; width: 44px; height: 44px; min-width: 44px; border: 0; border-radius: 50%; background: var(--soft); color: var(--muted); font-size: 20px; }
  .mm-line { margin: 14px 0 0; font-size: 18px; line-height: 1.35; }
  .mm-line .k { color: var(--muted); }
  .mm-theme { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
  .mm-box { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0 14px; padding: 16px 10px; border-radius: 20px; background: var(--bg); text-align: center; }
  .mm-box b { display: block; font-size: 16px; margin-bottom: 10px; }
  .mm-big { display: inline-flex; align-items: center; justify-content: center; width: 84px; height: 84px; border-radius: 50%; font-size: 40px; font-weight: 800; color: #fff; background: var(--muted); }
  .mm-avg { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 112px; height: 52px; padding: 0 14px; border-radius: 99px; font-size: 24px; font-weight: 800; color: #fff; background: var(--muted); margin-top: 16px; }
  .mm-note { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .mm-big.m5, .mm-avg.m5 { background: var(--m5); }
  .mm-big.m4, .mm-avg.m4 { background: var(--m4); }
  .mm-big.m3, .mm-avg.m3 { background: var(--m3); }
  .mm-big.m2, .mm-avg.m2 { background: var(--m2); }

  /* ---- уведомления ---- */

  .qrow input[type=time] { min-height: 44px; padding: 6px 10px; font-size: 18px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); }

<body>
<header>
  <div class="head-in">
    <div class="grow"><h1 class="hello" id="hello">Мой дневник</h1><div class="meta"><div class="who" id="who"></div><div class="sub" id="updated"></div></div></div>
    <button class="refresh" id="refresh" aria-label="Обновить"><span id="ricon">⟳</span><span class="rlabel"> Обновить</span></button>
    <button class="gear" id="gear" aria-label="Настройки" title="Настройки">⚙</button>
  </div>
</header>
<main id="main"></main>
<div id="modal"></div>
<nav class="tabs">
  <button data-tab="hw" class="on"><span class="e">📝</span>Домашка</button>
  <button data-tab="marks"><span class="e">⭐</span>Оценки</button>
  <button data-tab="plan"><span class="e">🗓</span>Расписание</button>
</nav>

<script>
window.__DATA__ = /*INLINE_DATA*/null;   // сервер подставляет сюда данные в «offline»-копии

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];   // месяцы пишем полностью
const WD = { пн: "понедельник", вт: "вторник", ср: "среда", чт: "четверг", пт: "пятница", сб: "суббота", вс: "воскресенье" };

// Иконка и цвет каждого предмета
const SUBJ = [
  [/рус/i, "📖", "#ef6c57"], [/матем|алгебр/i, "➗", "#4f6bed"], [/геометр|черч/i, "📐", "#3d7be0"],
  [/лит|чтен/i, "📚", "#c0589b"], [/англ|язык.*англ/i, "🔤", "#17a2b8"], [/истор/i, "🏛️", "#b7791f"],
  [/географ/i, "🌍", "#2f9e8f"], [/биолог|окр/i, "🌿", "#46a758"], [/музык/i, "🎵", "#9b5de5"],
  [/изо|рисов/i, "🎨", "#f06292"], [/физк|спорт/i, "⚽", "#f08c00"], [/труд|технолог/i, "🛠️", "#8d6e63"],
  [/информ/i, "💻", "#5c6bc0"], [/ров|разговор/i, "💬", "#26a69a"], [/род\.?\s*яз/i, "🗣️", "#e07a5f"], [/опд/i, "🕊️", "#7e8fb5"],
];
function subj(name) {
  const s = SUBJ.find(([re]) => re.test(name || "")) || [null, "📘", "#6b7bd6"];
  return { icon: s[1], color: s[2], style: `--c:${s[2]};--cbg:${s[2]}26` };
}

let data = null, tab = "hw", planDate = null, hwDate = null, banner = "", config = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// ---------- Настройки (хранятся на самом устройстве, у каждого телефона свои) ----------
const DEFAULTS = { theme: "auto", scale: 1, swipe: true, hwMode: "feed", showPast: false, teachers: true, startTab: "hw" };
const CHOICES = {
  theme: ["auto", "light", "dark"], scale: [0.9, 1, 1.1, 1.2], hwMode: ["feed", "pages"], startTab: ["hw", "marks", "plan"],
};
function loadSettings() {
  let raw = store.get("settings", {});
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) raw = {};
  const s = { ...DEFAULTS };
  for (const k of Object.keys(DEFAULTS)) {          // берём только известные и допустимые значения
    if (!(k in raw)) continue;
    if (CHOICES[k] ? CHOICES[k].includes(raw[k]) : typeof raw[k] === typeof DEFAULTS[k]) s[k] = raw[k];
  }
  return s;
}
let settings = loadSettings(), showSettings = false, askClearDone = false;
function applySettings() {
  const root = document.documentElement;
  if (settings.theme === "auto") delete root.dataset.theme; else root.dataset.theme = settings.theme;
  root.style.zoom = settings.scale === 1 ? "" : String(settings.scale);
}
function setSetting(key, value) {
  settings[key] = value;
  store.set("settings", settings);
  applySettings();
  if (key === "showPast") showPast = value;
}
applySettings();
tab = settings.startTab;

const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const todayIso = () => iso(new Date());
const dayName = (s) => { const d = parse(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
function rel(s) {
  const diff = Math.round((parse(s) - parse(todayIso())) / 864e5);
  return diff === 0 ? "Сегодня" : diff === 1 ? "Завтра" : diff === -1 ? "Вчера" : null;
}
const noHw = (t) => !t || /^(без\s+(домашнего\s+)?задани[яе]\.?|нет\s+домашнего\s+задания\.?|-|—)$/i.test(t.trim());
const hhmm = (s) => { const [h, m] = (s || "0:0").split(":").map(Number); return h * 60 + m; };

async function load() {
  if (window.__DATA__) {
    data = window.__DATA__;
    config = data.config || {};
    banner = `<div class="banner info">Это сохранённая копия. Чтобы увидеть свежее, открой дневник с домашним интернетом.</div>`;
    return render();
  }
  try {
    const r = await fetch("cgi-bin/data", { cache: "no-store" });
    let body = null; try { body = await r.json(); } catch {}
    if (r.status === 401 || body?.auth === true) { locked = true; data = null; config = {}; showSettings = false; await loadHint(); return render(); }   // нужен пароль семьи
    if (!r.ok || !body) throw new Error(r.status);
    locked = false;
    data = body;
    store.set("cache", data);
    banner = "";
  } catch {
    data = store.get("cache", null);
    banner = data
      ? `<div class="banner warn">Нет связи с домом. Показываю то, что было видно в прошлый раз.</div>`
      : `<div class="banner bad">Нет связи с домашним компьютером, и сохранённых данных пока нет. Подключись к домашнему Wi-Fi.</div>`;
  }
  config = data?.config || {};
  render();
}


// ---------- Вход в Дневник.ру (логин и пароль вводятся здесь, хранятся только на роутере) ----------
let showSetup = false, setupLogin = "", setupMsg = null, setupWait = false;
function setupCard() {
  const err = data?.status?.error;
  if (setupWait) return `<div class="card setup"><h2>Вход в Дневник.ру</h2><div class="msg good">${esc(setupMsg?.text || "Загружаю дневник…")}</div></div>`;
  const msg = setupMsg ? `<div class="msg ${setupMsg.ok ? "good" : "bad"}">${esc(setupMsg.text)}</div>`
    : (err && data?.status?.needLogin ? `<div class="msg bad">${esc(err)}</div>` : "");
  const restore = data?.status?.canRestore ? `<button class="restore" type="button" data-restore>↩ Вернуть прежний вход</button>
    <p class="fine">Вы только что вышли из аккаунта: прежний вход сохранён на сутки, его можно вернуть.</p>` : "";
  const cancel = showSetup && data?.days?.length ? `<button class="linkbtn" type="button" data-setup-cancel>Отмена, оставить как есть</button>` : "";
  return `<div class="card setup"><h2>Вход в Дневник.ру</h2>
    ${restore}
    <p>Введите логин и пароль ученика от <b>Дневник.ру</b> (это не логин и пароль от Госуслуг). Вводить нужно один раз: дальше дневник будет обновляться сам.</p>
    <form id="setup-form" autocomplete="on">
      <label for="s-login">Логин</label>
      <input id="s-login" name="login" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" value="${esc(setupLogin)}">
      <label for="s-pass">Пароль</label>
      <input id="s-pass" name="password" type="password" autocomplete="current-password">
      <button class="go" type="submit">Войти</button>
    </form>${msg}${cancel}
    <details><summary>У нас вход только через Госуслуги. Что делать?</summary>
      <p><b>Пароль от Госуслуг сюда вводить нельзя</b>: чужим программам его доверять небезопасно. Нужен отдельный логин и пароль Дневник.ру:
      они у ученика есть, но вы могли их ни разу не видеть.</p>
      <p><b>1.</b> Войдите на dnevnik.ru через Госуслуги, как обычно.<br><b>2.</b> Откройте профиль ученика → «Настройки» → «Логин и пароль»: там написан логин.<br>
      <b>3.</b> Нажмите «Изменить» у пароля и задайте свой новый пароль. Если сайт просит старый пароль, сначала укажите свой телефон в разделе
      «Контактные данные» и восстановите пароль по СМС.<br><b>4.</b> Введите здесь логин и этот новый пароль.</p>
      <p>Если так не получается, вход через Госуслуги делают один раз на компьютере: см. инструкцию «Запасной вариант» в README на GitHub (Rombaldo/dnevnik-OpenWRT).</p></details>
    <p class="fine">Пароль хранится только на вашем роутере, в закрытом файле. Он нужен, чтобы дневник сам входил заново, когда вход на сайте истекает.</p></div>`;
}

async function submitSetup(form) {
  const login = form.login.value.trim(), password = form.password.value;
  setupLogin = login;
  if (!login || !password) { setupMsg = { ok: false, text: "Введите логин и пароль." }; return render(); }
  const btn = form.querySelector("button.go"); btn.disabled = true; btn.textContent = "Проверяю…";
  let res;
  try {

async function waitForDiary() {            // ждём до ~2.5 минут, пока дневник загрузится

function closeConfirm() { confirmStep = 0; confirmError = ""; confirmBusy = false; logoutToken = null; render(); }

const PUSH_TYPES = [["mark", "Новые оценки", "Когда поставили оценку"], ["homework", "Новая домашка", "Когда задали или изменили задание"],
  ["schedule", "Отмена и перенос уроков", "Когда урок отменили или изменили расписание"], ["attendance", "Пропуски и опоздания", "Когда отметили пропуск или опоздание"]];
const PUSH_WHY = {

  "ios-home": "На iPhone уведомления работают, когда страница добавлена на экран «Домой» (Поделиться → «На экран Домой») и открыта оттуда. Нужна iOS 16.4 или новее.",
  unsupported: "Этот браузер не умеет показывать уведомления от сайтов. Попробуйте Chrome на Android или Safari на iPhone (со страницей на экране «Домой»).",
  offline: "В сохранённой копии уведомления недоступны.",

let pushState = { name: "", loaded: false, loading: false, supported: false, why: "", ready: true, subscribed: false, perm: "default", prefs: null, busy: false, msg: null, events: null };
const defaultPrefs = () => ({ types: { mark: true, homework: true, schedule: true, attendance: true }, quiet: { on: false, from: "22:00", to: "07:00" } });
function pushSupport() {
  if (window.__DATA__) return { ok: false, why: "offline" };
  if (!window.isSecureContext) return { ok: false, why: "insecure" };
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {

    const standalone = navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
    return { ok: false, why: ios && !standalone ? "ios-home" : "unsupported" };
  }

}
const keyBytes = (b64) => Uint8Array.from(atob(b64.replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(b64.length / 4) * 4, "=")), (c) => c.charCodeAt(0));

}
async function enablePush() {
  pushState.busy = true; pushState.msg = null; render();

    const perm = await Notification.requestPermission();
    pushState.perm = perm;
    if (perm !== "granted") { pushState.msg = { ok: false, text: "Уведомления запрещены для этого сайта. Разрешите их в настройках браузера и попробуйте снова." }; return; }
    const cfg = await api("cgi-bin/push", { action: "config" });
    if (locked) return;
    if (!cfg.ready) { pushState.ready = false; pushState.msg = { ok: false, text: cfg.message || "На роутере не установлен модуль уведомлений." }; return; }

    if (sub) {                                          // старая подписка, которую роутер не знает: делаем заново
      const g = await api("cgi-bin/push", { action: "get", endpoint: sub.endpoint });
      if (!g.subscribed) { await sub.unsubscribe().catch(() => {}); sub = null; }
    }
    sub = sub || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(cfg.publicKey) });

    pushState.msg = { ok: false, text: "Не получилось включить уведомления: " + (e && e.message ? e.message : "ошибка") + ". Если это iPhone, проверьте, что страница открыта с экрана «Домой»." };

}

const evWhen = (ts) => { const d = new Date(ts * 1000); return `${d.getDate()} ${MONTHS[d.getMonth()]}, ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };

function passCard() {

async function submitPass(form) {
  const cur = form["p-cur"]?.value || "", n1 = form["p-new"]?.value || "", n2 = form["p-new2"]?.value || "", hint = form["p-hint"]?.value || "";
  if (passForm === "set" || passForm === "change") {
    if (!n1.trim()) { passMsg = { ok: false, text: "Введите пароль." }; return render(); }
    if (n1 !== n2) { passMsg = { ok: false, text: "Пароли не совпадают." }; return render(); }
  }
  passBusy = true; passMsg = null; render();
  const r = await api("cgi-bin/auth", passForm === "disable" ? { action: "disable", current: cur }
    : passForm === "hint" ? { action: "hint", current: cur, hint } : { action: "set", current: cur, password: n1, hint });
  passBusy = false;
  if (locked) return;
  if (!r.ok) { passMsg = { ok: false, text: r.message || "Не получилось." }; return render(); }
  const did = passForm;
  passForm = null; passMsg = { ok: true, text: did === "disable" ? "Пароль отключён. Дневник снова открыт всем, кто видит эту страницу." : did === "hint" ? "Подсказка сохранена." : "Готово. Остальные устройства попросят новый пароль." };
  await load();
  showSettings = true; render();
}
async function passLogout() {                      // выйти на этом устройстве: пароль снова понадобится
  await api("cgi-bin/auth", { action: "logout" });
  try { localStorage.removeItem("cache"); localStorage.removeItem("done"); } catch {}
  passForm = null; passMsg = null; showSettings = false; locked = true; lockMsg = null; data = null; render();
}

function viewHw() {
  const focus = focusDate();
  const all = schoolDays();
  const done = store.get("done", {});
  if (settings.hwMode === "pages" && all.length) {                   // по одному дню, как в расписании
    const dates = all.map((d) => d.date);

// ---------- Карточка оценки: за что поставлена, учитель, тема урока, средний балл по предмету ----------
let markKey = null;
const numMarks = (list) => list.map((m) => Number(String(m.value).trim().split("/")[0])).filter((x) => x >= 1 && x <= 5);
const mean = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
function markDetails(key) {
  const [date, li, mi] = String(key).split("|");
  const lesson = data?.days.find((d) => d.date === date)?.lessons[Number(li)], mark = lesson?.marks[Number(mi)];
  if (!mark) return null;
  const subject = lesson.subject, mine = String(mark.value ?? "").trim(), when = mark.created || date;
  const same = allMarks().filter((m) => m.subject === subject);
  const avg = mean(numMarks(same)), before = mean(numMarks(same.filter((m) => m.created < when)));
  const y = (data.years || []).find((x) => x.current);                       // средний балл за период берём тот же, что показывает сайт, если он есть
  const term = y && (y.terms || []).find((t) => t.start && t.finish && date >= t.start && date <= t.finish);
  const official = String((term?.subjects || []).find((s) => s.name === subject)?.average || "");
  const value = official || (avg != null ? avg.toFixed(2).replace(".", ",") : "");
  const mine1 = Number(mine.split("/")[0]);
  const trend = before != null && mine1 >= 1 && mine1 <= 5 ? (mine1 > before ? "↑" : mine1 < before ? "↓" : "") : "";   // стрелка: оценка подняла или опустила средний балл
  return { date, subject, mine, work: mark.work || "Оценка", value, num: Number(value.replace(",", ".")), trend, official: !!official,
    theme: (lesson.theme || "").replace(/\s+/g, " ").trim(), teachers: teachersOf(subject).map((t) => t.name).filter(Boolean) };
}

const plural = (n, f) => { const m = Math.abs(n) % 100, d = m % 10; return m > 10 && m < 20 ? f[2] : d > 1 && d < 5 ? f[1] : d === 1 ? f[0] : f[2]; };
const lessonsWord = (n) => `${n} ${plural(n, ["урок", "урока", "уроков"])}`;

function missedDays(days) { return new Set((days || []).filter((d) => d.kind !== "late").map((d) => d.date)).size; }
const lessonsAndDays = (lessons, days) => (days ? `${lessonsWord(lessons)} <span style="white-space:nowrap">(${daysWord(days)})</span>` : lessonsWord(lessons));
const WDAY = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];
const ATT_ICON = { ill: "🤒", absent: "❗", late: "⏰" };
function lessonRanges(list) {
  const a = [...list].sort((x, y) => x - y), out = [];
  for (let i = 0; i < a.length; ) { let j = i; while (j + 1 < a.length && a[j + 1] === a[j] + 1) j++; out.push(j > i ? `${a[i]}–${a[j]}` : `${a[i]}`); i = j + 1; }
  return out.join(", ");
}
const daysGen = (n) => (n % 10 === 1 && n % 100 !== 11 ? "дня" : "дней");     // «из 41 дня», «из 42 дней»
// Сколько учебных дней было в периоде и в скольких из них ученик был в школе. Учебные дни берём из расписания (только для идущего года:
// за прошлые годы сайт расписание не отдаёт). День считается пропущенным целиком, если пропущены все его уроки; неполные дни считаем отдельно.
function schoolDayStats(t, y) {
  if (!y?.current || !t?.attendance) return null;
  const range = termRange(t);
  if (!range) return null;
  const today = todayIso(), last = range[1] < today ? range[1] : today, gone = {};
  for (const e of t.attendance.days || []) {
    if (e.kind === "late") continue;
    const set = (gone[e.date] ??= new Set());
    const nums = (e.lessons || []).length ? e.lessons : (e.items || []).map((i) => i.n);
    if (nums.length) nums.forEach((n) => set.add(Number(n))); else set.add("all");
  }
  let total = 0, full = 0, partial = 0;
  for (const [date, lessons] of schoolDayMap()) {
    if (date < range[0] || date > last) continue;
    total++;
    const set = gone[date];
    if (!set) continue;
    if (set.has("all") || lessons.every((l) => set.has(Number(l.n)))) full++; else partial++;
  }
  return total ? { total, attended: total - full, partial } : null;
}
const schoolDaysLine = (s) => (s ? `<br>Дней в школе: ${s.attended} из ${s.total}&nbsp;${daysGen(s.total)}${s.partial ? ` <span class="att-sub">(из них неполных: ${s.partial})</span>` : ""}` : "");
function attendanceCard(a, title = "Посещаемость", withDays = true, stats = null) {
  if (!a) return "";
  const absent = Number(a.absent) || 0, ill = Number(a.ill) || 0, late = Number(a.late) || 0, other = absent - ill;
  const parts = [];
  if (ill) parts.push(`${lessonsWord(ill)} по болезни`);
  if (other > 0) parts.push(`${lessonsWord(other)} по другим причинам`);
  const text = !absent && !late
    ? `<b>🎉 Пропусков и опозданий нет</b><br>Всего уроков: ${Number(a.total) || 0}${schoolDaysLine(stats)}`
    : `<b>Пропущено ${lessonsAndDays(absent, missedDays(a.days))}</b>${parts.length ? `<br>${parts.join(", ")}` : ""}${late ? `<br>Опозданий: ${late}` : ""}<br>Всего уроков: ${Number(a.total) || 0}${schoolDaysLine(stats)}`;
  const days = withDays && (a.days || []).length ? `<details><summary>Показать дни (${a.days.length})</summary>${a.days.map((d) => {
    const dt = parse(d.date);
    return `<div class="att-day"><span>${ATT_ICON[d.kind] || "•"}</span><b>${dt.getDate()} ${MONTHS[dt.getMonth()]}, ${WDAY[dt.getDay()]}</b>
      <span>${esc(d.name)}${(d.lessons || []).length ? `, ${(d.lessons || []).length > 1 ? "уроки" : "урок"} ${esc(lessonRanges(d.lessons))}` : ""}</span></div>`; }).join("")}</details>` : "";
  return `<div class="card att ${absent || late ? "warn" : ""}"><div class="att-title">${esc(title)}</div>
    <div class="att-head"><div class="att-pct"><strong>${Number(a.percent) || 0}%</strong><span>на уроках</span></div><div class="att-text">${text}</div></div>${days}</div>`;
}
function attendanceYear(y) {
  const rows = (y.terms || []).filter((t) => t.attendance);
  if (!rows.length) return "";
  const total = rows.reduce((s, t) => s + (Number(t.attendance.total) || 0), 0), absent = rows.reduce((s, t) => s + (Number(t.attendance.absent) || 0), 0);
  const pct = total ? Math.round((100 * (total - absent)) / total) : 100;
  const lab = y.periodLabel === "тр" ? "тр" : "пер.";
  const all = rows.map((t) => schoolDayStats(t, y)).filter(Boolean);
  const yearStats = all.length ? { total: all.reduce((s, x) => s + x.total, 0), attended: all.reduce((s, x) => s + x.attended, 0), partial: all.reduce((s, x) => s + x.partial, 0) } : null;
  return `<div class="card att ${absent ? "warn" : ""}" style="margin-top:12px"><div class="att-title">Посещаемость за год</div>
    <div class="att-head"><div class="att-pct"><strong>${pct}%</strong><span>на уроках</span></div>
    <div class="att-text"><b>${absent ? `Пропущено ${lessonsAndDays(absent, missedDays(rows.flatMap((t) => t.attendance.days || [])))}` : "🎉 Пропусков нет"}</b><br>Всего уроков: ${total}${schoolDaysLine(yearStats)}</div></div>
    <div class="att-terms">${rows.map((t) => `<div><span>${esc(t.number)} ${lab}</span><span>${t.attendance.absent ? `пропущено ${lessonsAndDays(Number(t.attendance.absent) || 0, missedDays(t.attendance.days))}` : "без пропусков"} · ${Number(t.attendance.percent) || 0}%</span></div>`).join("")}</div></div>`;
}
function currentAttendanceCard() {
  const y = (data.years || []).find((x) => x.current);
  const t = y && [...(y.terms || [])].reverse().find((x) => x.attendance);
  return t ? attendanceCard(t.attendance, `Посещаемость (${t.number} ${y.periodLabel === "тр" ? "тр" : "пер."})`, true, schoolDayStats(t, y)) : "";
}

// ---------- Экран «Посещаемость»: календарь по дням ----------
const MONTHS_FULL = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];
const MONTHS_GEN = MONTHS;
const WD_FULL = ["воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"];
let attDay = null, attTerm = {};

function schoolDayMap() { const m = new Map(); for (const d of data.days) { const ls = d.lessons.filter((l) => !l.canceled); if (ls.length) m.set(d.date, ls); } return m; }
function termRange(t) {
  const ds = (t.attendance?.days || []).map((d) => d.date).sort();
  const start = t.start || ds[0], finish = t.finish || ds[ds.length - 1];
  return start && finish ? [start, finish] : null;
}

function calendarHtml(t, y) {
  const range = termRange(t);
  if (!range) return "";
  const [start, finish] = range, today = todayIso();
  const byDay = {};
  for (const d of t.attendance.days) (byDay[d.date] ??= []).push(d);
  const school = y.current ? schoolDayMap() : null;
  let cur = parse(start); cur = new Date(cur.getFullYear(), cur.getMonth(), 1);
  const end = parse(finish);
  let out = "";
  while (cur <= end) {
    const yr = cur.getFullYear(), mo = cur.getMonth(), n = new Date(yr, mo + 1, 0).getDate();
    const lead = (new Date(yr, mo, 1).getDay() + 6) % 7;                   // неделя начинается с понедельника
    let cells = "";
    for (let i = 0; i < lead; i++) cells += `<span class="cal-cell blank"></span>`;
    for (let d = 1; d <= n; d++) {
      const dt = new Date(yr, mo, d), date = iso(dt), wd = dt.getDay(), ents = byDay[date];
      if (date < start || date > finish) { cells += `<span class="cal-cell blank"></span>`; continue; }
      let kind;
      if (ents) kind = ents.some((e) => e.kind === "absent") ? "absent" : ents.some((e) => e.kind === "ill") ? "ill" : "late";
      else if (school) kind = school.has(date) ? (date <= today ? "ok" : "future") : "none";
      else kind = wd === 0 || wd === 6 ? "none" : "ok";   // за прошлые годы расписания нет: будни без пропусков считаем днями на уроках
      const cl = `cal-cell ${kind} ${date === today ? "today" : ""} ${date === attDay ? "sel" : ""}`;
      cells += kind === "none" ? `<span class="${cl}">${d}</span>` : `<button class="${cl}" data-aday="${date}" aria-label="${d} ${MONTHS_GEN[mo]}">${d}</button>`;
    }
    out += `<div class="cal-month"><div class="cal-title">${MONTHS_FULL[mo]} ${yr}</div><div class="cal-grid">
      ${["пн", "вт", "ср", "чт", "пт", "сб", "вс"].map((w) => `<span class="cal-wd">${w}</span>`).join("")}${cells}</div></div>`;
    cur = new Date(yr, mo + 1, 1);
  }
  return out;
}

function dayInfoHtml(t, y) {
  if (!attDay) return `<div class="att-hint">Нажмите на день в календаре, чтобы увидеть подробности.</div>`;
  const dt = parse(attDay), title = `${dt.getDate()} ${MONTHS_GEN[dt.getMonth()]}, ${WD_FULL[dt.getDay()]}`;
  const ents = (t.attendance?.days || []).filter((d) => d.date === attDay);
  let body;
  if (ents.length) {
    body = ents.map((e) => {

      return `<div class="dp-row"><span>${ATT_ICON[e.kind] || "•"}</span><div><b>${esc(e.name)}</b><div class="dp-items">${items}</div></div></div>`;

function viewYears() {

// Переключение дня (в «Расписании» и в «Домашке» по одному дню): стрелками или свайпом

  ((tab === "plan" && planView === "days") || (tab === "hw" && settings.hwMode === "pages"));
function shiftPage(delta) {
  const plan = tab === "plan";
  const dates = plan ? data.days.filter((d) => d.lessons.length).map((d) => d.date) : schoolDays().map((d) => d.date);
  const cur = plan ? planDate : hwDate;
  const next = Math.max(0, Math.min(dates.length - 1, dates.indexOf(cur) + delta));
  if (dates[next] === cur) return;
  if (plan) planDate = dates[next]; else hwDate = dates[next];
  pageAnim = delta > 0 ? "from-right" : "from-left";
  render();
}
let touch = null;
document.addEventListener("touchstart", (e) => {
  touch = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() } : null;
}, { passive: true });
document.addEventListener("touchend", (e) => {
  if (!touch || !settings.swipe || !pagedNow()) return;
  const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y, fast = Date.now() - touch.t < 900;
  touch = null;
  if (fast && Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) shiftPage(dx < 0 ? 1 : -1);
}, { passive: true });

document.addEventListener("submit", (e) => {
  if (e.target.id === "setup-form") { e.preventDefault(); submitSetup(e.target); }
  if (e.target.id === "lock-form") { e.preventDefault(); submitLock(e.target); }
  if (e.target.id === "pass-form") { e.preventDefault(); submitPass(e.target); }
});

document.addEventListener("click", (e) => {
  const pu = e.target.closest("[data-push]");
  if (pu) { const v = pu.dataset.push; if (v === "enable") enablePush(); else if (v === "test") testPush(); else if (v === "disable") disablePush(); return; }
  const pf = e.target.closest("[data-pf]");
  if (pf) { pushState.prefs = pushState.prefs || defaultPrefs(); pushState.prefs.types[pf.dataset.pf] = !pushState.prefs.types[pf.dataset.pf]; render(); savePushPrefs(); return; }
  const pq = e.target.closest("button[data-pq]");
  if (pq) { pushState.prefs = pushState.prefs || defaultPrefs(); pushState.prefs.quiet.on = !pushState.prefs.quiet.on; render(); savePushPrefs(); return; }
  if (e.target.closest("[data-mark-close]")) { markKey = null; showMarkModal(); return; }
  const mk = e.target.closest("[data-mark]");
  if (mk) { markKey = mk.dataset.mark; showMarkModal(); return; }
  const pa = e.target.closest("[data-pass]");
  if (pa) {
    const v = pa.dataset.pass;
    if (v === "logout") { passLogout(); return; }
    passForm = v === "cancel" ? null : v; passMsg = null; render();
    const first = document.querySelector("#pass-form input"); if (first) first.focus();
    return;
  }
  if (e.target.closest("[data-settings-close]")) { showSettings = false; render(); window.scrollTo(0, 0); return; }
  const st = e.target.closest("[data-set]");
  if (st) {
    const key = st.dataset.set, raw = st.dataset.val, val = key === "scale" ? Number(raw) : raw;
    if (CHOICES[key]?.includes(val)) { setSetting(key, val); const y = window.scrollY; render(); window.scrollTo(0, y); }
    return;
  }
  const fl = e.target.closest("[data-flip]");
  if (fl) { setSetting(fl.dataset.flip, !settings[fl.dataset.flip]); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (e.target.closest("[data-clear-done]")) {
    if (!askClearDone) askClearDone = true; else { try { localStorage.removeItem("done"); } catch {} askClearDone = false; }
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (e.target.closest("[data-reset-settings]")) {
    settings = { ...DEFAULTS }; store.set("settings", settings); applySettings(); showPast = settings.showPast; askClearDone = false;
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (e.target.closest("[data-change-login]")) { confirmStep = 1; confirmError = ""; render(); return; }
  const cf = e.target.closest("[data-confirm]");
  if (cf) {
    if (cf.dataset.confirm === "no") { closeConfirm(); return; }
    if (cf.disabled || confirmBusy) return;
    if (confirmStep === 1) startLogout(); else finishLogout();
    return;
  }
  if (e.target.matches("[data-modal-back]")) { if (markKey) { markKey = null; showMarkModal(); return; } if (!confirmBusy) closeConfirm(); return; }
  if (e.target.closest("[data-setup-cancel]")) { showSetup = false; setupMsg = null; render(); return; }
  if (e.target.closest("[data-restore]")) { restoreLogin(); return; }
  if (e.target.closest("[data-setup]")) { showSetup = !showSetup; setupMsg = null; render(); window.scrollTo(0, 0); return; }
  const mv = e.target.closest("[data-mview]");
  if (mv) { marksView = mv.dataset.mview; attDay = null; render(); return; }
  const ad = e.target.closest("[data-aday]");
  if (ad) { attDay = attDay === ad.dataset.aday ? null : ad.dataset.aday; const y0 = window.scrollY; render(); window.scrollTo(0, y0); return; }
  const at = e.target.closest("[data-aterm]");
  if (at) { const y = (data.years || [])[yearIdx]; if (y) attTerm[y.label] = at.dataset.aterm; attDay = null; render(); return; }
  const pv = e.target.closest("[data-pview]");
  if (pv) { planView = pv.dataset.pview; render(); return; }
  const yb = e.target.closest("[data-year]");
  if (yb) { yearIdx += Number(yb.dataset.year); attDay = null; render(); return; }
  const tb = e.target.closest("[data-term]");
  if (tb) { const y = (data.years || [])[yearIdx]; if (y) termSel[y.label] = tb.dataset.term; render(); return; }
  const tabBtn = e.target.closest("nav.tabs button");
  if (tabBtn) { tab = tabBtn.dataset.tab; showSettings = false; askClearDone = false; render(); window.scrollTo(0, 0); return; }
  const check = e.target.closest(".check");
  if (check) {
    const strip = check.closest(".strip"), done = store.get("done", {}), k = strip.dataset.key;
    done[k] ? delete done[k] : (done[k] = 1);
    store.set("done", done);
    const y = window.scrollY; render(); window.scrollTo(0, y);
    return;
  }
  if (e.target.closest("[data-past]")) { showPast = !showPast; render(); return; }
  const head = e.target.closest("[data-toggle]");
  if (head) { head.parentElement.classList.toggle("open"); return; }
  const nav = e.target.closest("[data-nav]");
  if (nav) shiftPage(Number(nav.dataset.nav));
});

$("#gear").addEventListener("click", () => { showSettings = !showSettings; askClearDone = false; passForm = null; passMsg = null; render(); window.scrollTo(0, 0); });

$("#refresh").addEventListener("click", async () => {
  const b = $("#refresh"); b.disabled = true; $("#ricon").className = "spin";
  try { await fetch("cgi-bin/refresh", { method: "POST" }); } catch {}
  setTimeout(async () => { await load(); b.disabled = false; $("#ricon").className = ""; }, 15000);
});

document.addEventListener("visibilitychange", () => { if (!document.hidden && !window.__DATA__ && !locked) load(); });
load();
</script>
</body>
</html>
